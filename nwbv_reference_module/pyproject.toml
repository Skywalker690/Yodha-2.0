[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "az-nwbv-reference"
version = "0.1.0"
description = "Descriptive age-matched OASIS-2 nWBV reference for research workspaces"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
az_nwbv_reference = ["data/*.json"]
